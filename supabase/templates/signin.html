<div style="background:#FFF3D6;padding:32px 16px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1E1532">
  <div style="max-width:420px;margin:0 auto;background:#FFFFFF;border:3px solid #1E1532;border-radius:24px;box-shadow:4px 4px 0 #1E1532;padding:28px;text-align:center">
    <div style="font-size:40px;line-height:1">🥞🍜🍔</div>
    <h1 style="font-size:26px;margin:16px 0 8px">Your blr_eats code</h1>
    <p style="font-size:16px;margin:0 0 20px;opacity:.8">Type this code on the sign-in screen:</p>
    <div style="font-size:40px;font-weight:800;letter-spacing:10px;background:#FFC93C;border:3px solid #1E1532;border-radius:16px;padding:14px 8px;margin:0 0 20px">{{ .Token }}</div>
    <p style="font-size:15px;margin:0 0 12px">Or tap the button on this phone:</p>
    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#1E1532;color:#FFF3D6;text-decoration:none;font-weight:800;font-size:17px;padding:12px 28px;border-radius:999px">Sign me in →</a>
    <p style="font-size:13px;margin:22px 0 0;opacity:.6">The code works for an hour. If you didn't ask for it, ignore this email.</p>
  </div>
</div>
